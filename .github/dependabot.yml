# Dependabot keeps every pinned version in this repo current by opening PRs.
# Each PR runs the full CI + Security + Container pipeline before it can merge.
version: 2

updates:
  # GitHub Actions pinned to commit SHAs. Dependabot updates the SHA *and* the
  # "# vX.Y.Z" comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:23"
      timezone: America/New_York
    # Wait 7 days after a release before proposing it: most compromised or
    # broken releases are caught and pulled within that window.
    # (Security updates for known vulnerabilities are not delayed.)
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  # Exact pins in pyproject.toml (dev, security and release extras).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:23"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      python-tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]

  # Base image digest in the Dockerfile's FROM lines.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:23"
      timezone: America/New_York
    cooldown:
      default-days: 7
    # Only 3.14.x patches and new digests (security fixes for the same Python).
    # A new Python minor version is a deliberate upgrade: the test matrix has to
    # cover it first, so it's done by hand, not by a bot.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "container"
    labels: ["dependencies", "docker"]

  # Terraform provider version in infra/github (exact build pinned by .terraform.lock.hcl).
  - package-ecosystem: terraform
    directory: /infra/github
    schedule:
      interval: weekly
      day: monday
      time: "08:23"
      timezone: America/New_York
    cooldown:
      default-days: 7
    commit-message:
      prefix: "infra"
    labels: ["dependencies", "terraform"]
