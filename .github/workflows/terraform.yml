name: Terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  schedule:
    # Daily drift check, 10:37 UTC: catches settings changed by hand in the UI.
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_DIR: infra/github

jobs:
  # ------------------------------------------------------------ no secrets needed
  validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.7"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir="$TF_DIR" fmt -check -diff -recursive

      # Downloads the provider and checks its hash against .terraform.lock.hcl.
      - name: terraform init (no backend)
        run: terraform -chdir="$TF_DIR" init -backend=false -lockfile=readonly

      - name: terraform validate
        run: terraform -chdir="$TF_DIR" validate

  # ------------------------------------------------------------ read-only plan
  plan:
    name: Terraform plan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.7"
          terraform_wrapper: false

      # Secrets aren't given to PRs from forks or Dependabot; skip cleanly then.
      - name: Check for plan token
        id: token
        env:
          TF_PLAN_TOKEN: ${{ secrets.TF_PLAN_TOKEN }}
        run: |
          if [ -n "$TF_PLAN_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TF_PLAN_TOKEN not available in this context; skipping plan."
          fi

      - name: terraform init
        if: steps.token.outputs.present == 'true'
        run: terraform -chdir="$TF_DIR" init -lockfile=readonly

      # The token is a fine-grained PAT that can only READ this one repository's
      # settings. A leaked copy can't change anything.
      - name: terraform plan
        if: steps.token.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.TF_PLAN_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          terraform -chdir="$TF_DIR" plan -lock=false -no-color -out=tfplan > plan.txt 2>&1
          status=$?
          set -e
          cat plan.txt
          if [ "$status" -ne 0 ]; then exit "$status"; fi

          # Imports are expected (CI has no state). Anything else is a real change.
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          changes=$(jq '[.resource_changes[] | select(.change.actions != ["no-op"])] | length' plan.json)
          {
            echo "### Terraform plan"
            echo "Resources that would change: **$changes**"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # On the daily schedule, any change means someone edited a setting by
          # hand: fail so it shows up red and GitHub emails the owner.
          if [ "$EVENT" = "schedule" ] && [ "$changes" -gt 0 ]; then
            echo "::error::Drift detected: live GitHub settings differ from infra/github."
            exit 1
          fi
