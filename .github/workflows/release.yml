name: Release

# Runs only when a version tag like v0.2.0 is pushed. Pre-release tags
# (v0.2.0-rc1) don't match the pattern and are ignored.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Nothing by default. Each job asks for exactly what it needs.
permissions: {}

# Never run two releases for the same tag at once, and never cancel one halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"

jobs:
  # ------------------------------------------------------------ 1. verify
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to check the tag is on main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          # No dependency cache in the release workflow: a cache written by an
          # untrusted PR run could otherwise end up inside a published artifact.

      - name: Install
        run: pip install -e ".[dev]"

      # Only release code that went through a reviewed PR into main.
      - name: Tag must point to a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release from main only."
            exit 1
          fi

      # v0.2.0 must match __version__ = "0.2.0", or the image and wheel would disagree.
      - name: Tag must match package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import pwcheck; print(pwcheck.__version__)')"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package version $pkg (src/pwcheck/__init__.py)."
            exit 1
          fi

      - name: Run tests
        run: pytest -q

  # ------------------------------------------------------------ 2. image -> GHCR
  publish-image:
    name: Publish image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/pwcheck
      id-token: write # OIDC identity for signing the provenance attestation
      attestations: write # store the attestation
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"   # registry names must be lowercase
          version="${GITHUB_REF_NAME#v}"            # 0.2.0
          minor="${version%.*}"                     # 0.2
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$image:$version $image:$minor $image:latest $image:sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      # Step outputs are passed through env vars, never pasted into the script
      # with ${{ }}, so a crafted value can't turn into shell code.
      - name: Build image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build --pull \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag pwcheck:release .

      - name: Install Trivy (checksum-verified)
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" trivy

      # Scan BEFORE pushing: a vulnerable image never reaches the registry.
      - name: Gate on fixable HIGH/CRITICAL vulnerabilities
        run: ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed pwcheck:release

      # GITHUB_TOKEN is created for this run and expires when it ends:
      # no personal access token or long-lived secret stored anywhere.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          read -r -a tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            docker tag pwcheck:release "$tag"
            docker push --quiet "$tag"
          done
          # The digest identifies the exact image bytes, whichever tag is used.
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' \
                    "${IMAGE}:${VERSION}" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo '```'
            printf '%s\n' "${tags[@]}"
            echo "digest: $digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Signed SLSA build provenance: proves this image was built by this
      # workflow, from this commit. Verify with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # ------------------------------------------------------------ 3. GitHub Release
  github-release:
    name: Create GitHub Release
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC identity for signing the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          # No dependency cache in the release workflow: a cache written by an
          # untrusted PR run could otherwise end up inside a published artifact.

      - name: Build wheel and sdist
        run: |
          pip install ".[release]"
          python -m build
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance (wheel + sdist)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # The changelog is generated from the titles of PRs merged since the
      # previous tag, which is why every change goes through a PR.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Container image

          \`\`\`bash
          docker pull $image:$version
          docker run --rm -it $image:$version
          \`\`\`

          Digest: \`$DIGEST\`

          Verify where it came from:

          \`\`\`bash
          gh attestation verify oci://$image:$version --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pwcheck $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
