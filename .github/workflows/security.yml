name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 09:17 UTC. New CVEs are published even when the code
    # doesn't change, so dependency and CodeQL scans also run on a timer.
    - cron: "17 9 * * 1"
  workflow_dispatch:

# Default for every job: read-only. Jobs that upload SARIF add
# security-events: write for themselves only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ SAST: Bandit
  bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Bandit
        run: pip install ".[security]"

      # Exits non-zero on any finding, which fails the job. The SARIF file is
      # still written, and the upload step below runs anyway (if: always()).
      - name: Run Bandit
        run: bandit -r src -f sarif -o bandit.sarif

      - name: Upload Bandit results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ------------------------------------------------------------ SAST: CodeQL
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none # Python is interpreted: nothing to compile
          queries: security-extended # more security queries than the default suite

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  # ------------------------------------------------------------ SCA: pip-audit
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # pwcheck has zero runtime dependencies, so this audits the toolchain
      # that builds and tests it (pytest, ruff, mypy, bandit, ...).
      - name: Install project with dev and security tools
        run: pip install -e ".[dev,security]"

      - name: Run pip-audit
        run: |
          set +e
          pip-audit --skip-editable --desc -f markdown -o audit.md --progress-spinner off
          status=$?
          {
            echo "### pip-audit"
            cat audit.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # ------------------------------------------------------------ Secrets: Gitleaks
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: a secret deleted later is still in old commits
          persist-credentials: false

      # Download the official binary and refuse to run it unless its hash
      # matches the pinned value (protects against a tampered download).
      - name: Install Gitleaks (checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan full git history
        run: ./gitleaks git . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload Gitleaks results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
