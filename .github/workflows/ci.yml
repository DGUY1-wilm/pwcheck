name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # lets you re-run manually from the Actions tab

# Least privilege: the GITHUB_TOKEN for this workflow can only read the repo.
permissions:
  contents: read

# A new push to the same branch/PR cancels the older, now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # don't leave the token in .git/config

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false               # see results for every version, not just the first failure
      matrix:
        python-version: ["3.10", "3.14"]   # oldest supported + newest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Coverage options and the fail_under threshold live in pyproject.toml,
      # so this is exactly the same command you run locally.
      - name: Run tests with coverage
        run: pytest -v

      - name: Add coverage to job summary
        if: always()
        run: |
          echo '### Coverage (Python ${{ matrix.python-version }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore
