[build-system]
requires = ["setuptools>=77"]  # 77+ understands SPDX license strings
build-backend = "setuptools.build_meta"

[project]
name = "pwcheck"
dynamic = ["version"]  # single source of truth: __version__ in src/pwcheck/__init__.py
description = "Password strength checker with HaveIBeenPwned k-anonymity breach lookup"
readme = "README.md"
requires-python = ">=3.10"  # 3.9 reached end-of-life in Oct 2025
license = "MIT"
license-files = ["LICENSE"]
dependencies = []  # standard library only

[project.optional-dependencies]
# Exact pins = reproducible CI. Dependabot (Stage 5) will propose upgrades as PRs.
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]
# Security scanners (Stage 2). Separate extra so the CI lint/test jobs stay lean.
security = [
    "bandit[sarif]==1.9.4",
    "pip-audit==2.10.1",
]
# Release tooling (Stage 4): builds the wheel and sdist attached to GitHub Releases.
release = [
    "build==1.6.1",
]

[project.scripts]
pwcheck = "pwcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pwcheck.__version__" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
src = ["src", "tests"]
# target-version is read from requires-python above

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle errors/warnings
    "F",        # pyflakes: unused imports, undefined names
    "I",        # isort: import ordering
    "B",        # flake8-bugbear: likely bugs (mutable defaults, etc.)
    "UP",       # pyupgrade: modern syntax for the target Python
    "SIM",      # flake8-simplify
    "S",        # flake8-bandit: security checks (Bandit itself runs in Stage 2)
    "RUF",      # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.ruff.format]
# defaults (Black-compatible); `ruff format --check` fails CI if files aren't formatted

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true  # small, stdlib-only codebase: no excuse not to be strict
files = ["src"]
pretty = true
warn_unreachable = true

# ---------------------------------------------------------------- pytest + coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",                          # summary of skips/failures at the end
    "--strict-markers",
    "--cov=pwcheck",
    "--cov-report=term-missing",    # shows which lines are not covered
    "--cov-report=xml",             # coverage.xml, uploaded as a CI artifact
]

[tool.coverage.run]
branch = true  # count both sides of every if/else, not just lines

[tool.coverage.report]
fail_under = 95  # actual is 100%; small buffer so a refactor isn't blocked by one line
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
]
