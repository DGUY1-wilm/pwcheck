[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwcheck"
version = "0.1.0"
description = "Password strength checker with HaveIBeenPwned k-anonymity breach lookup"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pwcheck = "pwcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
